<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>볼펜 부품 집기 확인</title>
<style>
/* One camera screen. Top: what to pick next. On the picture: an outline and name on every part.
   Green = right part, red = wrong part. Dark panels on purpose (they sit on a camera image). */
:root {
  --ink: #f4f7fb; --muted: #b6c0cc; --glass: rgba(11, 15, 21, 0.78); --line: rgba(255,255,255,.16);
  --accent: #2f80ff; --ok: #22c55e; --bad: #ef4444; --bg: #0b0f14;
  --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#cam, #ov { position: fixed; inset: 0; width: 100%; height: 100%; }
#cam { object-fit: cover; background: #000; }
#ov { pointer-events: none; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(255,255,255,.08); color: var(--ink); font: 650 16px var(--font); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.small { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 12px; background: var(--glass); }

.top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.banner { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 4px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background-color .2s, border-color .2s; }
.banner .row { display: flex; align-items: center; gap: 10px; }
.num { flex: none; min-width: 34px; height: 34px; padding: 0 7px; border-radius: 17px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; font-size: 17px; }
.banner h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.banner p { margin: 0; color: var(--muted); font-size: 14.5px; }
.banner.ok { background: rgba(21, 128, 61, .92); border-color: var(--ok); }
.banner.ok p { color: #e7fbe9; }
.banner.bad { background: rgba(185, 28, 28, .94); border-color: var(--bad); }
.banner.bad p { color: #ffe4e4; }
.banner.ok .num, .banner.bad .num { background: #fff; color: #111; }
.flash { position: fixed; inset: 0; pointer-events: none; border: 0 solid transparent; transition: border-width .15s; }
.flash.ok { border: 14px solid var(--ok); }
.flash.bad { border: 18px solid var(--bad); }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); }
.dots { display: flex; gap: 6px; padding: 9px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); }
.dots i.done { background: var(--ok); }
.dots i.now { background: var(--accent); }
.right { display: flex; gap: 8px; }

.start { position: fixed; inset: 0; display: grid; place-items: center; overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));
  background: radial-gradient(120% 70% at 50% 0%, #1b2a3d 0%, #0b0f14 65%); }
.start-card { width: min(26rem, 100%); display: grid; gap: 14px; }
.start h2 { margin: 0; font-size: 28px; line-height: 1.2; }
.start p { margin: 0; color: var(--muted); }
.start ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.fig { width: 100%; height: auto; border-radius: 14px; background: #f5f4ef; }
.err { color: #ffb4b4 !important; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="ov"></canvas>
<div id="flash" class="flash"></div>

<div class="top" id="top" hidden>
  <div id="banner" class="banner" role="status" aria-live="assertive">
    <div class="row"><span id="num" class="num">1</span><h1 id="head"></h1></div>
    <p id="sub"></p>
  </div>
</div>

<div class="bottom" id="bottom" hidden>
  <div id="dots" class="dots" aria-hidden="true"></div>
  <div class="right">
    <button id="go" class="btn small" type="button" hidden></button>
    <button id="restart" class="btn small" type="button"></button>
    <button id="lang2" class="btn small" type="button"></button>
  </div>
</div>

<div id="start" class="start">
  <div class="start-card">
    <h2 id="s-title"></h2>
    <p id="s-lead"></p>
    <svg class="fig" viewBox="0 0 320 150" aria-hidden="true">
      <rect x="14" y="10" width="292" height="130" rx="6" fill="#ffffff" stroke="#d7d4ca"/>
      <rect x="34" y="34" width="110" height="13" rx="4" fill="#23262b"/><rect x="38" y="34" width="10" height="13" fill="#c9cdd2"/>
      <rect x="180" y="34" width="62" height="14" rx="5" fill="#15171a"/>
      <rect x="40" y="76" width="118" height="3" rx="1.5" fill="#1d1f22"/>
      <rect x="40" y="96" width="118" height="3" rx="1.5" fill="#d2232a"/>
      <rect x="40" y="116" width="118" height="3" rx="1.5" fill="#1f4fd6"/>
      <rect x="28" y="26" width="122" height="29" rx="6" fill="none" stroke="#2f80ff" stroke-width="3"/>
      <rect x="28" y="16" width="44" height="14" rx="7" fill="#2f80ff"/><text x="50" y="26.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="system-ui">상단</text>
    </svg>
    <ol id="s-tips"></ol>
    <button id="s-start" class="btn primary" type="button"></button>
    <button id="s-lang" class="btn" type="button"></button>
    <p id="s-err" class="err" hidden></p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
