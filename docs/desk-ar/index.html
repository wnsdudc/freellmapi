<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>3색 볼펜 AR 조립</title>
<style>
/* Camera screen: live camera full screen, dark glass panels on top. One dark look on purpose (it sits on a camera picture).
   Blue = the 3D highlight; green/red = right/wrong part signals. */
:root {
  --ink: #f4f7fb; --muted: #b6c0cc; --glass: rgba(11, 15, 21, 0.76); --glass-line: rgba(255, 255, 255, 0.14);
  --accent: #2f80ff; --ok: #22c55e; --bad: #ef4444; --warn: #ffcf70; --bg: #0b0f14;
  --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#cam, #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#cam { object-fit: cover; background: #000; }
#gl { touch-action: none; }
body.viewer #cam { display: none; }
body.viewer { background: radial-gradient(120% 80% at 50% 30%, #1d2733 0%, #0b0f14 70%); }
body.xr #cam, body.xr #mini-bg { display: none; }
#mini-bg { position: fixed; width: 132px; height: 132px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
button { font: inherit; }
.btn { min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--glass-line); background: rgba(255,255,255,.08); color: var(--ink);
  font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:focus-visible, .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.icon { width: 48px; padding: 0; }
.btn.icon svg { width: 22px; height: 22px; }
.btn:disabled { opacity: .35; }
.btn.wide { width: 100%; }

/* top */
.bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.step { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; padding: 8px 12px 10px; min-width: 0; flex: 1 1 auto; max-width: 26rem;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.count { font-size: 13px; font-weight: 750; letter-spacing: .06em; color: var(--accent); font-variant-numeric: tabular-nums; }
.step h1 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 750; text-wrap: balance; }
.progress { display: flex; gap: 3px; list-style: none; margin: 8px 0 0; padding: 0; }
.progress li { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
.progress li.done { background: rgba(255,255,255,.7); }
.progress li.now { background: var(--accent); }
.side { display: grid; gap: 6px; justify-items: end; flex: none; }
.chip-btn { min-height: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); font-weight: 650; font-size: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tabs { display: flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); }
.tab { min-height: 34px; padding: 0 10px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 13.5px; }
.tab[aria-pressed="true"] { background: var(--ink); color: #0b0f14; }

/* part check box + verdict */
.box { position: absolute; border: 3px dashed rgba(255,255,255,.85); border-radius: 18px; pointer-events: none !important; transition: border-color .15s, box-shadow .15s; }
.box.ok { border: 4px solid var(--ok); box-shadow: 0 0 0 9999px rgba(34,197,94,.10), 0 0 28px rgba(34,197,94,.6) inset; }
.box.bad { border: 4px solid var(--bad); box-shadow: 0 0 0 9999px rgba(239,68,68,.16), 0 0 28px rgba(239,68,68,.6) inset; }
.box-label { position: absolute; left: 50%; top: -16px; transform: translate(-50%, -100%); white-space: nowrap; font-size: 14px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); }
.verdict { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 16px;
  font-weight: 750; font-size: 17px; width: min(calc(100% - 24px), 360px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.verdict svg { width: 26px; height: 26px; flex: none; }
.verdict.ok { background: var(--ok); color: #03220f; }
.verdict.bad { background: var(--bad); color: #fff; }
.verdict small { display: block; font-weight: 600; font-size: 13.5px; opacity: .92; }
.seeing { position: absolute; left: 50%; transform: translateX(-50%); font-size: 13.5px; font-weight: 650; padding: 4px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); white-space: nowrap; }

/* card */
.card { position: absolute; left: 0; right: 0; bottom: 0;
  margin: 0 max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(10px, env(safe-area-inset-left, 0px));
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 12px 14px 12px; display: grid; gap: 9px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.card p { margin: 0; }
.expect { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.expect b { color: var(--ink); display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,.4); display: inline-block; }
.tip { font-size: 14px; color: var(--muted); }
.tip b { color: var(--warn); margin-right: 4px; }
.nav { display: grid; grid-template-columns: 1fr auto auto 1.6fr; gap: 8px; }

/* AR mode */
.status { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line); font-weight: 650; font-size: 14px; white-space: nowrap; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.status.on .dot { background: var(--ok); }
.floor { position: absolute; left: 50%; transform: translateX(-50%); min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--accent); color: #fff;
  font-weight: 750; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.floor svg { width: 22px; height: 22px; }
.xrbar { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 124px); display: grid; justify-items: center; gap: 8px; padding: 0 12px; }
.xrbar p { margin: 0; padding: 8px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); text-align: center; font-weight: 650; max-width: 30rem; }
.xrbar div { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.xrbar .btn { background: var(--glass); min-height: 44px; }

/* full-screen panels */
.panel { position: absolute; inset: 0; display: grid; place-items: center; overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(120% 70% at 50% 0%, #1b2a3d 0%, #0b0f14 65%); }
.panel-card { width: min(28rem, 100%); display: grid; gap: 12px; }
.eyebrow { margin: 0; color: var(--accent); font-weight: 750; letter-spacing: .1em; font-size: 13px; text-transform: uppercase; }
.panel h2 { margin: 0; font-size: 30px; line-height: 1.15; }
.panel p { margin: 0; }
.meta { color: var(--muted); }
.fine { font-size: 12.5px; color: var(--muted); }
.langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.langs .btn[aria-pressed="true"] { background: var(--ink); color: #0b0f14; border-color: var(--ink); }
.fig { width: 100%; height: auto; }

/* registration: bottom sheet over the camera */
.reg { position: absolute; left: 0; right: 0; bottom: 0;
  margin: 0 max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(10px, env(safe-area-inset-left, 0px));
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 14px; display: grid; gap: 10px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.reg h3 { margin: 0; font-size: 17px; }
.reg p { margin: 0; }
.reg-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.reg-list li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 13px; color: var(--muted); border: 1.5px solid transparent; }
.reg-list li.now { border-color: var(--accent); color: var(--ink); }
.reg-list li.done { color: var(--ink); }
.reg-list li.done::after { content: "✓"; color: var(--ok); font-weight: 800; }
.reg-now { font-size: 17px; font-weight: 700; }
.meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
.reg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reg-foot { display: flex; justify-content: space-between; gap: 8px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px 0; cursor: pointer; }
.msg { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 100px); background: #1b2330; border: 1px solid var(--glass-line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.msg p { margin: 0; }
.loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-line); font-weight: 650; }
@media (min-width: 760px) {
  .card, .reg { left: auto; width: 440px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="mini-bg" hidden></div>
<canvas id="gl" aria-label="3D view"></canvas>

<div id="ui">
  <header class="bar" data-noxr>
    <div class="step">
      <span id="count" class="count"></span>
      <h1 id="title"></h1>
      <ol id="progress" class="progress" aria-hidden="true"></ol>
    </div>
    <div class="side">
      <button id="lang" class="chip-btn" type="button"></button>
      <div class="tabs" role="group">
        <button id="tab-parts" class="tab" type="button" aria-pressed="true"></button>
        <button id="tab-ar" class="tab" type="button" aria-pressed="false"></button>
      </div>
    </div>
  </header>

  <div id="box" class="box" hidden><span id="box-label" class="box-label"></span></div>
  <div id="seeing" class="seeing" hidden></div>
  <div id="verdict" class="verdict" role="status" hidden>
    <svg id="v-ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff" opacity=".25"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg id="v-bad" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff" opacity=".25"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
    <span><span id="v-head"></span><small id="v-detail"></small></span>
  </div>

  <div id="status" class="status" role="status" hidden><span class="dot"></span><span id="status-text"></span></div>
  <button id="floor" class="floor" type="button" hidden data-noxr>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l9 4 9-4M3 17l9-4 9 4M12 3v10M8.5 6.5 12 3l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="floor-text"></span>
  </button>
  <div id="xrbar" class="xrbar" hidden data-noxr>
    <p id="xr-hint"></p>
    <div>
      <button id="xr-move" class="btn" type="button"></button>
      <button id="xr-left" class="btn icon" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="xr-right" class="btn icon" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="xr-scale" class="btn" type="button"></button>
      <button id="xr-exit" class="btn" type="button"></button>
    </div>
  </div>

  <section id="card" class="card" aria-live="polite" data-noxr>
    <p id="body"></p>
    <p id="expect" class="expect"><span id="expect-label"></span><b><i id="expect-swatch" class="swatch"></i><span id="expect-name"></span></b></p>
    <p id="tip" class="tip"><b id="tip-label"></b><span id="tip-text"></span></p>
    <div class="nav">
      <button id="prev" class="btn" type="button"></button>
      <button id="replay" class="btn icon" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="size" class="btn icon" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="next" class="btn primary" type="button"></button>
    </div>
  </section>

  <section id="reg" class="reg" hidden data-noxr>
    <h3 id="reg-title"></h3>
    <ol id="reg-list" class="reg-list"></ol>
    <p id="reg-now" class="reg-now"></p>
    <p id="reg-help" class="meta"></p>
    <div class="meter" aria-hidden="true"><i id="reg-meter"></i></div>
    <div class="reg-actions">
      <button id="reg-start" class="btn primary" type="button"></button>
      <button id="reg-next" class="btn" type="button"></button>
    </div>
    <div class="reg-foot">
      <button id="reg-reset" class="linkish" type="button"></button>
      <button id="reg-skip" class="linkish" type="button"></button>
    </div>
  </section>

  <div id="start" class="panel">
    <div class="panel-card">
      <p id="s-eyebrow" class="eyebrow"></p>
      <h2 id="s-product"></h2>
      <p id="s-meta" class="meta"></p>
      <svg class="fig" viewBox="0 0 320 96" aria-hidden="true">
        <rect x="10" y="40" width="96" height="16" rx="8" fill="#23262b" stroke="#b6c0cc"/>
        <rect x="70" y="35" width="14" height="5" rx="1.5" fill="#d2232a"/><rect x="86" y="35" width="14" height="5" rx="1.5" fill="#1f4fd6"/>
        <rect x="114" y="42" width="56" height="12" rx="6" fill="#15171a" stroke="#b6c0cc"/>
        <rect x="180" y="20" width="120" height="4" rx="2" fill="#1d1f22" stroke="#b6c0cc" stroke-width=".6"/>
        <rect x="180" y="34" width="120" height="4" rx="2" fill="#d2232a"/>
        <rect x="180" y="48" width="120" height="4" rx="2" fill="#1f4fd6"/>
        <path d="M200 70h80" stroke="#2f80ff" stroke-width="3" stroke-dasharray="6 5"/><path d="M276 63l9 7-9 7" fill="none" stroke="#2f80ff" stroke-width="3"/>
      </svg>
      <p id="s-intro"></p>
      <p id="s-pick" class="fine"></p>
      <div class="langs" role="group">
        <button id="s-ko" class="btn" type="button">한국어</button>
        <button id="s-en" class="btn" type="button">English</button>
      </div>
      <button id="s-start" class="btn primary wide" type="button"></button>
      <button id="s-viewer" class="btn wide" type="button"></button>
      <p id="s-demo" class="fine"></p>
    </div>
  </div>

  <div id="loading" class="loading" hidden></div>
  <div id="msg" class="msg" role="alert" hidden data-noxr>
    <p id="msg-text"></p>
    <button id="msg-close" class="btn" type="button"></button>
  </div>
</div>

<script src="vendor/tf.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
